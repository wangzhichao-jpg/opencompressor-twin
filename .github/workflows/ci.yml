# Defined locally; NOT yet executed on a hosted runner (no remote repository exists).
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/check_public_tree.py

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: octwin demo --output demo-out

  lower-bounds:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy==1.26.*" "scipy==1.12.*" "CoolProp>=7,<7.1" "pytest>=8"
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Inspect distributions
        run: |
          python - <<'EOF'
          import glob, tarfile, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert all(n.startswith(("octwin/", "opencompressor_twin-")) for n in names), names
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0])
          bad = [n for n in sdist.getnames() if "资料库" in n or "/runs/" in n or n.endswith((".pdf", ".docx"))]
          assert not bad, bad
          EOF
      - name: Clean install from wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/octwin demo --output /tmp/demo-out
