[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencompressor-twin"
version = "0.1.0a1"
description = "Unified compressor performance calibration, baseline benchmarking and test-design research toolkit (research preview)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "CoolProp>=7,<9"]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DATA_LICENSES.md"]
authors = [{ name = "Jianke Environment and Energy Technology Co., Ltd." }]
keywords = ["compressor", "refrigeration", "rolling piston", "scroll", "calibration", "design of experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wangzhichao-jpg/opencompressor-twin"
Repository = "https://github.com/wangzhichao-jpg/opencompressor-twin"
Mirror = "https://gitee.com/bigtaurus/opencompressor-twin"

[project.scripts]
octwin = "octwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["资料库", "runs", ".tmp", ".cache", "build", "dist", "tools/prepare_*.py", "tools/transcribe_arep11.py", "tools/run_round5_external.py", "tools/freeze_round5_protocol.py"]  # frozen-evidence scripts: never auto-format

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E741", "B905"]  # B905: adding zip(strict=True) would change runtime behaviour; review separately

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
